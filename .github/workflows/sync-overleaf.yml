name: Sync Overleaf to GitHub
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-overleaf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Set git identity
        run: |
          git config --global user.name "dong881"
          git config --global user.email "minghunghsu.taiwan@gmail.com"

      - name: Add Overleaf as remote and fetch/merge
        env:
          OVERLEAF_ID: ${{ secrets.OVERLEAF_ID }}
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          git remote add overleaf https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_ID}
          git fetch overleaf
          git merge overleaf/master --allow-unrelated-histories -m "Auto merge from Overleaf"

      - name: Pull from GitHub and merge (auto-resolve on conflict)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git remote set-url origin https://dong881:${GH_TOKEN}@github.com/dong881/MingThesis.git
          # 自動拉取 GitHub master 並以 ours 為主自動解衝突
          git pull origin master --allow-unrelated-histories --no-edit -X theirs

      - name: Push merged changes back to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git push origin master
