name: Sync Overleaf to GitHub
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-overleaf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0  # 取回完整 git tree 方便新建/快取 branch

      - name: Set git identity
        env:
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"

      - name: Add Overleaf as remote and fetch/merge
        env:
          OVERLEAF_ID: ${{ secrets.OVERLEAF_ID }}
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          set -e
          # Idempotent remote add
          if git remote get-url overleaf >/dev/null 2>&1; then
            git remote set-url overleaf https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_ID}
          else
            git remote add overleaf https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_ID}
          fi
          git fetch overleaf
          
          # Only merge if there are actual changes
          if [ -z "$(git diff HEAD..overleaf/master)" ]; then
            echo "No changes from Overleaf. Nothing to merge."
          else
            echo "Changes detected from Overleaf. Merging..."
            # Merge favoring Overleaf on conflicts; auto-resolve if still failing (add/add, binaries)
            if ! git merge overleaf/master --allow-unrelated-histories -X theirs --no-edit; then
              echo "Conflict detected. Auto-resolving in favor of Overleaf (theirs)."
              git checkout --theirs .
              git add .
              git commit -m "Auto-resolve conflicts favoring Overleaf"
            fi
          fi

      - name: Pull from GitHub and merge (auto-resolve on conflict)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          set -e
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          if git ls-remote --exit-code --heads origin master; then
            if ! git pull origin master --allow-unrelated-histories --no-edit -X ours; then
              echo "Conflict pulling origin. Keeping local (with Overleaf) version."
              git checkout --ours .
              git add .
              git commit -m "Auto-resolve conflicts favoring local (Overleaf merged)"
            fi
          else
            git checkout -b master || git checkout master
          fi

      - name: Push merged changes back to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git push origin master
