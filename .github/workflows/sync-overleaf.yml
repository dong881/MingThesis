name: Sync Overleaf to GitHub
on:
  schedule:
    - cron: '0 * * * *'  # 每小時執行一次，可調整頻率
  workflow_dispatch:

jobs:
  sync-overleaf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3

      - name: Set git identity
        run: |
          git config --global user.name "dong881"
          git config --global user.email "minghunghsu.taiwan@gmail.com"

      - name: Clone Overleaf as tmp dir
        env:
          OVERLEAF_ID: ${{ secrets.OVERLEAF_ID }}
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          git clone https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_ID} overleaf || (echo "Overleaf Clone Failed" && exit 1)
          ls overleaf # Debug: 顯示 clone 內容是否完整

      - name: Add overleaf as remote, fetch & merge to main repo
        run: |
          git remote add overleaf ./overleaf
          git fetch overleaf
          git merge overleaf/master --allow-unrelated-histories -m "Auto-merge from Overleaf"

      - name: Push merged changes back to GitHub
        run: |
          git push origin master
