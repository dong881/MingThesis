name: Sync Overleaf to GitHub
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-overleaf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0  # 取回完整 git tree 方便新建/快取 branch

      - name: Set git identity
        env:
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"

      - name: Pull from GitHub to get latest changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          # If master branch exists on remote, pull changes. Otherwise, we are on a fresh repo.
          if git ls-remote --exit-code --heads origin master; then
            echo "Pulling latest changes from GitHub..."
            git pull origin master --rebase
          else
            echo "No master branch on remote. Skipping pull."
          fi

      - name: Add Overleaf as remote and merge
        env:
          OVERLEAF_ID: ${{ secrets.OVERLEAF_ID }}
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          set -e
          # Idempotent remote add
          if git remote get-url overleaf >/dev/null 2>&1; then
            git remote set-url overleaf https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_ID}
          else
            git remote add overleaf https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_ID}
          fi
          git fetch overleaf
          
          # Only merge if there are actual changes from Overleaf
          if [ -z "$(git diff HEAD..overleaf/master)" ]; then
            echo "No changes from Overleaf. Nothing to merge."
          else
            echo "Changes detected from Overleaf. Merging and squashing..."
            # Squash merge to combine Overleaf commits into one
            if ! git merge --squash overleaf/master --allow-unrelated-histories; then
              echo "Conflict detected. Auto-resolving in favor of Overleaf (theirs)."
              git checkout --theirs .
              git add .
            fi
            git commit -m "auto pull from overleaf"
          fi

      - name: Push merged changes back to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Only push if there are changes to push
          if [ -z "$(git log origin/master..HEAD)" ]; then
            echo "No new commits to push."
          else
            echo "Pushing changes to GitHub..."
            git push origin master
          fi
          git push origin master
