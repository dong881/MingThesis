name: Sync Overleaf to GitHub
on:
#  schedule:
#    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-overleaf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0  # 取回完整 git tree 方便新建/快取 branch

      - name: Set git identity
        env:
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"

      - name: Pull from GitHub to get latest changes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          # If master branch exists on remote, pull changes. Otherwise, we are on a fresh repo.
          if git ls-remote --exit-code --heads origin master; then
            echo "Pulling latest changes from GitHub..."
            git pull origin master --rebase
          else
            echo "No master branch on remote. Skipping pull."
          fi

      - name: Add Overleaf as remote and merge
        env:
          OVERLEAF_ID: ${{ secrets.OVERLEAF_ID }}
          OVERLEAF_TOKEN: ${{ secrets.OVERLEAF_TOKEN }}
        run: |
          set -e
          # Idempotent remote add
          if git remote get-url overleaf >/dev/null 2>&1; then
            git remote set-url overleaf https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_ID}
          else
            git remote add overleaf https://git:${OVERLEAF_TOKEN}@git.overleaf.com/${OVERLEAF_ID}
          fi
          git fetch overleaf
          
          # Only merge if there are actual changes from Overleaf
          if [ -z "$(git diff HEAD..overleaf/master)" ]; then
            echo "No changes from Overleaf. Nothing to merge."
          else
            echo "Changes detected from Overleaf. Merging and squashing..."
            # Squash merge to combine Overleaf commits into one
            if ! git merge --squash overleaf/master --allow-unrelated-histories; then
              echo "Conflict detected. Auto-resolving in favor of Overleaf (theirs)."
              
              # Handle different types of conflicts
              git status --porcelain | while read -r status file; do
                case "$status" in
                  "DU")
                    # File deleted by us (local), modified by them (overleaf) - keep their version
                    echo "Keeping Overleaf version of: $file"
                    git add "$file"
                    ;;
                  "UD")
                    # File modified by us (local), deleted by them (overleaf) - remove it
                    echo "Removing file deleted in Overleaf: $file"
                    git rm "$file"
                    ;;
                  "AA"|"UU")
                    # File modified by both - take their version if it exists
                    if git cat-file -e overleaf/master:"$file" 2>/dev/null; then
                      echo "Taking Overleaf version of: $file"
                      git checkout --theirs "$file"
                      git add "$file"
                    else
                      echo "File doesn't exist in Overleaf, removing: $file"
                      git rm "$file"
                    fi
                    ;;
                  *)
                    # Other conflicts - try to take their version
                    if git cat-file -e overleaf/master:"$file" 2>/dev/null; then
                      echo "Resolving conflict for: $file"
                      git checkout --theirs "$file"
                      git add "$file"
                    else
                      echo "Cannot resolve conflict for: $file, removing"
                      git rm "$file" 2>/dev/null || true
                    fi
                    ;;
                esac
              done
            fi
            
            # Only commit if there are staged changes
            if ! git diff --cached --quiet; then
              git commit -m "Automatically pull from Overleaf."
            else
              echo "No changes to commit after merge."
            fi
          fi

      - name: Generate commit message with Gemini
        env:
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
        run: |
          # Check if GEMINI_TOKEN is available
          if [ -z "$GEMINI_TOKEN" ]; then
            echo "GEMINI_TOKEN not available, skipping AI commit message generation"
            exit 0
          fi
          
          # Check if there are staged changes or recent commits to describe
          if git diff --cached --quiet && [ -z "$(git log origin/master..HEAD)" ]; then
            echo "No changes to describe"
            echo "COMMIT_MESSAGE=Automatically pull from Overleaf." >> $GITHUB_ENV
            exit 0
          fi
          
          # Get the diff for staged changes or recent commits
          if ! git diff --cached --quiet; then
            DIFF_OUTPUT=$(git diff --cached)
          else
            DIFF_OUTPUT=$(git diff origin/master..HEAD)
          fi
          
          # Prepare prompt for Gemini
          PROMPT="請根據以下Git diff內容，生成一個簡短的commit訊息（不超過50字），並在下一行列出主要變更項目的大綱（每項用-開頭）：$DIFF_OUTPUT 請用以下格式回覆：\n[簡短摘要]\n\n- [變更項目1]\n- [變更項目2]\n- [變更項目3]"
          
          # Define models to try in order
          MODELS=("gemini-3-flash-preview" "gemini-2.5-pro" "gemini-2.5-flash" "gemini-2.5-flash-lite")
          GENERATED_MESSAGE=""
          
          for MODEL in "${MODELS[@]}"; do
            echo "Trying to generate commit message with model: $MODEL"
            
            # Call Gemini API
            RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"contents\": [{
                  \"parts\": [{
                    \"text\": \"$PROMPT\"
                  }]
                }]
              }")
            
            # Extract the generated text from response
            CANDIDATE=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null)
            
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "null" ] && [ "$CANDIDATE" != "" ]; then
              echo "Successfully generated message with $MODEL"
              GENERATED_MESSAGE="$CANDIDATE"
              break
            else
              echo "Failed to generate with $MODEL. Response snippet: $(echo "$RESPONSE" | head -c 100)..."
            fi
          done
          
          # Validate the response and set commit message
          if [ -n "$GENERATED_MESSAGE" ]; then
            echo "Final generated commit message:"
            echo "$GENERATED_MESSAGE"
            # Escape newlines for GitHub environment variable
            ESCAPED_MESSAGE=$(echo "$GENERATED_MESSAGE" | sed ':a;N;$!ba;s/\n/\\n/g')
            echo "COMMIT_MESSAGE=$ESCAPED_MESSAGE" >> $GITHUB_ENV
          else
            echo "All models failed to generate commit message, using default"
            echo "COMMIT_MESSAGE=Automatically pull from Overleaf." >> $GITHUB_ENV
          fi

      - name: Update commit message if generated
        env:
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
        run: |
          # Only proceed if GEMINI_TOKEN is available
          if [ -z "$GEMINI_TOKEN" ]; then
            echo "GEMINI_TOKEN not available, using default commit message"
            echo "COMMIT_MESSAGE=Automatically pull from Overleaf." >> $GITHUB_ENV
            exit 0
          fi
          
          # If we have a generated message and there are commits to amend
          if [ -n "$COMMIT_MESSAGE" ] && [ "$COMMIT_MESSAGE" != "Automatically pull from Overleaf." ]; then
            # Check if there are commits to amend (commits ahead of origin/master)
            if git rev-list origin/master..HEAD | grep -q .; then
              # Decode escaped newlines
              FINAL_MESSAGE=$(echo -e "$COMMIT_MESSAGE")
              echo "Updating commit message to:"
              echo "$FINAL_MESSAGE"
              git commit --amend -m "$FINAL_MESSAGE"
            else
              echo "No commits to amend"
            fi
          else
            echo "Using default commit message or no COMMIT_MESSAGE set"
          fi

      - name: Set default commit message if no Gemini token
        if: env.GEMINI_TOKEN == ''
        run: |
          echo "COMMIT_MESSAGE=Automatically pull from Overleaf." >> $GITHUB_ENV

      - name: Push merged changes back to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Only push if there are changes to push
          if [ -z "$(git log origin/master..HEAD)" ]; then
            echo "No new commits to push."
          else
            echo "Pushing changes to GitHub..."
            git push origin master
          fi
